[package]
name = "tether-core"
version = "0.1.0"
edition = "2021"
description = "Shared Tether client core: protocol, replay, sessions"
publish = false

[dependencies]
base64 = "0.22"
regex = "1"
snow = "0.10"
argon2 = "0.5"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
thiserror = "2"
alacritty_terminal = { version = "0.26.0", optional = true }
unicode-normalization = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util"] }
tether-proto = { path = "../tether-proto" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
prost = "0.14"

[features]
default = []
# iOS-only VT parser. Desktop links tether-core without this feature so xterm.js
# remains the sole emulator there.
terminal-parser = ["dep:alacritty_terminal", "dep:unicode-normalization"]
