[package]
name = "tether-core"
version = "0.1.0"
edition = "2021"
description = "Shared Tether client core: the VT terminal emulator and its grid/replay model"
publish = false

[dependencies]
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
alacritty_terminal = { version = "0.26.0", optional = true }
unicode-normalization = { version = "0.1", optional = true }

[features]
default = []
# iOS-only VT parser; gated so the crate can build without the emulator too.
terminal-parser = ["dep:alacritty_terminal", "dep:unicode-normalization"]
