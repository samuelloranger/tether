[package]
name = "tether-term"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tether-core = { path = "../tether-core" }
alacritty_terminal = { version = "=0.26.0", default-features = false }
swash = "=0.2.10"
# The versions Slint already builds, so neither adds a compile.
skrifa = "=0.44.0"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
base64.workspace = true
miniz_oxide = "0.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
unicode-properties = { version = "0.1.4", default-features = false, features = ["emoji"] }
unicode-segmentation = "1.13.3"
harfrust = "0.14.0"

[target.'cfg(windows)'.dependencies]
# The version and DirectWrite bindings Slint's font stack already builds.
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite", "Win32_Globalization"] }
# `#[implement]` expands to paths in this crate.
windows-core = "0.62.2"

[dev-dependencies]
tempfile.workspace = true
