[package]
name = "tether-term"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tether-core = { path = "../tether-core" }
alacritty_terminal = { version = "=0.26.0", default-features = false }
swash = "=0.2.10"
base64.workspace = true
miniz_oxide = "0.8"
