[workspace]
resolver = "3"
members = [
    "crates/tether-core",
    "crates/tether-ssh",
    "crates/tether-term",
    "crates/tether-app",
]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
tether-core = { path = "crates/tether-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27", features = ["v4", "serde"] }
zeroize = "1.9"
thiserror = "2.0.21"
ssh-key = { version = "0.6.7", features = ["std"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem", "rand_core"] }
rsa = { version = "0.9.10", features = ["pem"] }
p256 = { version = "0.13", features = ["pkcs8", "pem", "ecdsa"] }
p384 = { version = "0.13", features = ["pkcs8", "pem", "ecdsa"] }
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
tempfile = "3.27"

# An 8K screenshot is 132 MB of pixels; unoptimised deflate makes its test take minutes.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image]
opt-level = 3

# The terminal is rasterized on the CPU every frame: unoptimized, a full-screen frame takes
# ~60 ms instead of ~5 ms, which makes debug builds feel broken. Keep our own crates
# debuggable but optimize the renderer and every dependency.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.tether-term]
opt-level = 3
