# Deploy this on its own host. It is intentionally NOT part of the Tether
# server's compose stack: the relay is internet-facing, a Tether server is a
# remote shell, and the two should never share an attack surface.
services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:8090:8090'
    environment:
      APNS_KEY_ID: ${APNS_KEY_ID:?set APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID:?set APNS_TEAM_ID}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:?set APNS_BUNDLE_ID}
      APNS_KEY_PATH: /run/secrets/apns_key.p8
      # 'production' serves TestFlight and App Store builds; 'sandbox' only
      # serves builds installed directly from Xcode.
      APNS_ENV: ${APNS_ENV:-production}
    volumes:
      # Mounted read-only, never copied into the image.
      - ${APNS_KEY_FILE:?set APNS_KEY_FILE}:/run/secrets/apns_key.p8:ro
