<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Agents API — Live Scan</title>
<style>
  :root {
    --bg:#08080E; --surface:#12121D; --surfaceRaised:#191926; --border:#232333;
    --ink:#EDEEF6; --mut:#9797AC; --faint:#61617A;
    --accent:#7C8CF8; --working:#F2B34C; --waiting:#FF7050; --done:#6EE7A8; --cool:#7C8CF8;
    --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans: -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); }
  .wrap { min-height:100%; padding:18px; max-width:960px; margin:0 auto; }
  header { margin-bottom:14px; }
  .live { display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px; color:var(--done);
    background:color-mix(in srgb,var(--done) 12%,transparent); border:1px solid color-mix(in srgb,var(--done) 30%,transparent);
    padding:4px 9px; border-radius:999px; }
  .live .d { width:8px; height:8px; border-radius:50%; background:var(--done); box-shadow:0 0 8px var(--done); animation:blink 1.4s infinite; }
  @keyframes blink { 50%{opacity:.4} }
  h1 { font-size:20px; font-weight:750; letter-spacing:-.3px; margin:10px 0 2px; }
  .sub { font-family:var(--mono); font-size:11.5px; color:var(--mut); }
  .ep { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px; }
  .epc { font-family:var(--mono); font-size:11px; color:var(--ink); background:var(--surface); border:1px solid var(--border);
    padding:6px 10px; border-radius:8px; display:flex; align-items:center; gap:8px; }
  .st200 { color:var(--done); font-weight:700; }
  .cnt { color:var(--faint); }

  .grid2 { display:grid; grid-template-columns:1fr; gap:14px; margin-top:12px; }
  @media (min-width:720px){ .grid2 { grid-template-columns:1.05fr .95fr; } }

  .panel { background:linear-gradient(180deg,var(--surface),#0e0e17); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .ph { display:flex; align-items:center; gap:8px; padding:10px 13px; border-bottom:1px solid var(--border); }
  .ph b { font-size:12.5px; font-weight:650; }
  .ph .tag { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--faint); }

  /* graph */
  .canvas { position:relative; height:430px; overflow:hidden;
    background:radial-gradient(600px 300px at 50% 0,#10131a 0,transparent 70%); }
  svg.edges { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .edge { fill:none; stroke:var(--border); stroke-width:1.6; }
  .edge.working{stroke:color-mix(in srgb,var(--working) 60%,transparent)} .edge.waiting{stroke:color-mix(in srgb,var(--waiting) 70%,transparent)}
  .edge.done{stroke:color-mix(in srgb,var(--done) 50%,transparent)} .edge.cursor{stroke-dasharray:3 5;stroke:#7d6bc4}
  .node { position:absolute; transform:translate(-50%,-50%); width:120px; }
  .card { background:color-mix(in srgb,var(--surfaceRaised) 60%,transparent); border:1px solid var(--border); border-radius:11px; padding:8px 9px; }
  .card.cursor { border-style:dashed; }
  .r1 { display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .nm { font-size:12px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { font-family:var(--mono); font-size:9.5px; color:var(--mut); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stt { font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.5px; margin-top:4px; }
  .s-working{color:var(--working)} .s-waiting{color:var(--waiting)} .s-done{color:var(--done)} .s-idle{color:var(--faint)}
  .bg-working{background:var(--working)} .bg-waiting{background:var(--waiting);box-shadow:0 0 7px var(--waiting)} .bg-done{background:var(--done)} .bg-idle{background:var(--faint)}
  .card.st-waiting{border-color:color-mix(in srgb,var(--waiting) 35%,transparent);background:color-mix(in srgb,var(--waiting) 9%,transparent)}

  /* json */
  pre { margin:0; padding:12px 13px; font-family:var(--mono); font-size:10.5px; line-height:1.5; color:#cfd3e2;
    max-height:430px; overflow:auto; white-space:pre; }
  .k{color:var(--accent)} .s{color:var(--done)} .n{color:var(--working)} .nl{color:var(--faint)}

  /* proof checklist */
  .proof { margin-top:14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  .proof h2 { font-size:13px; margin:0 0 10px; font-weight:700; }
  .chk { display:grid; grid-template-columns:1fr; gap:7px; }
  @media (min-width:620px){ .chk{grid-template-columns:1fr 1fr;} }
  .ci { display:flex; align-items:flex-start; gap:9px; font-size:12.5px; }
  .ci .y { color:var(--done); font-weight:800; flex:0 0 auto; }
  .ci code { font-family:var(--mono); font-size:11px; color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,transparent); padding:1px 5px; border-radius:5px; }
  .ci .d { color:var(--mut); }
  .note { margin-top:12px; font-size:12px; color:var(--mut); border-top:1px solid var(--border); padding-top:10px; }
  .note code{font-family:var(--mono);font-size:11px;color:var(--ink)}
  footer { margin-top:16px; font-family:var(--mono); font-size:10.5px; color:var(--faint); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="live"><span class="d"></span>LIVE · captured from the running Phase 1 routes</span>
    <h1>Agents API — real response, rendered</h1>
    <div class="sub" id="cap"></div>
    <div class="ep" id="eps"></div>
  </header>

  <div class="grid2">
    <div class="panel">
      <div class="ph"><b>Graph built from the JSON</b><span class="tag" id="gtag"></span></div>
      <div class="canvas" id="canvas"><svg class="edges" id="edges" viewBox="0 0 350 430" preserveAspectRatio="xMidYMid meet"></svg></div>
    </div>
    <div class="panel">
      <div class="ph"><b>GET /api/sessions/sess-tether/agents</b><span class="tag">verbatim</span></div>
      <pre id="json"></pre>
    </div>
  </div>

  <div class="proof">
    <h2>Does the server give the iOS view everything it needs? — from the live payload</h2>
    <div class="chk" id="chk"></div>
    <div class="note" id="note"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const VW=350, VH=430;
const HEAT = { working:'var(--working)', waiting:'var(--waiting)', done:'var(--done)', idle:'var(--faint)' };
const LABEL = { working:'working', waiting:'waiting', done:'finished', idle:'idle' };

function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function hljson(obj){
  const j = JSON.stringify(obj, null, 2);
  return j
    .replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
    .replace(/&quot;/g,'"')
    .replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>')
    .replace(/: (\d+)/g, ': <span class="n">$1</span>')
    .replace(/: null/g, ': <span class="nl">null</span>');
}

// simple layered layout from parentId
function layout(nodes){
  const byId = new Map(nodes.map(n=>[n.agentId,n]));
  const depth = new Map();
  function d(n){ if(depth.has(n.agentId)) return depth.get(n.agentId);
    const v = n.parentId && byId.has(n.parentId) ? d(byId.get(n.parentId))+1 : 0;
    depth.set(n.agentId,v); return v; }
  nodes.forEach(d);
  const levels = {};
  nodes.forEach(n=>{ const lv=depth.get(n.agentId); (levels[lv]=levels[lv]||[]).push(n); });
  const pos = new Map();
  const maxLv = Math.max(...Object.keys(levels).map(Number));
  for(const lv in levels){
    const row = levels[lv]; const n = row.length;
    row.forEach((node,i)=>{
      const x = n===1 ? VW/2 : 40 + (VW-80)*(i/(n-1));
      const y = 55 + (Number(lv)/(Math.max(maxLv,1))) * (VH-120);
      pos.set(node.agentId, {x,y});
    });
  }
  return pos;
}

fetch('./data.json').then(r=>r.json()).then(d=>{
  const one = d.endpoints['GET /api/sessions/sess-tether/agents'];
  const all = d.endpoints['GET /api/agents'];
  const nodes = one.body;

  document.getElementById('cap').textContent = 'captured ' + d.capturedAt + ' · driven through the real Hono app in-process (isolated temp DB)';
  document.getElementById('eps').innerHTML =
    `<span class="epc">GET /api/sessions/:id/agents <span class="st200">${one.status}</span> <span class="cnt">${one.body.length} nodes</span></span>` +
    `<span class="epc">GET /api/agents <span class="st200">${all.status}</span> <span class="cnt">${all.body.length} nodes · ${new Set(all.body.map(a=>a.sessionId)).size} sessions</span></span>`;
  document.getElementById('gtag').textContent = nodes.length + ' nodes · parentId → edges';
  document.getElementById('json').innerHTML = hljson(one.body);

  // render graph
  const canvas = document.getElementById('canvas'), svg = document.getElementById('edges');
  const pos = layout(nodes);
  for(const n of nodes){
    if(n.parentId && pos.has(n.parentId)){
      const A=pos.get(n.parentId), B=pos.get(n.agentId);
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      const my=(A.y+B.y)/2;
      p.setAttribute('d',`M ${A.x} ${A.y+18} C ${A.x} ${my}, ${B.x} ${my-20}, ${B.x} ${B.y-20}`);
      p.setAttribute('class','edge '+(n.kind==='cursor'?'cursor':n.state));
      svg.appendChild(p);
    }
  }
  for(const n of nodes){
    const p=pos.get(n.agentId);
    const el=document.createElement('div'); el.className='node'; el.style.left=(p.x/VW*100)+'%'; el.style.top=(p.y/VH*100)+'%';
    el.innerHTML = `<div class="card ${n.kind==='cursor'?'cursor':''} st-${n.state}">
      <div class="r1"><span class="dot bg-${n.state}"></span><span class="nm">${esc(n.name)}</span></div>
      <div class="meta">${esc(n.kind)}${n.model?' · '+esc(n.model):''}</div>
      <div class="stt s-${n.state}">${LABEL[n.state]||n.state}</div>
    </div>`;
    canvas.appendChild(el);
  }

  // proof checklist mapping UI-need -> field present in payload
  const sample = nodes[0];
  const needs = [
    ['Node identity','agentId', sample.agentId],
    ['Tree edges (parent→child)','parentId', 'orchestrator ← subagents ← cursor'],
    ['Node colour','state', nodes.map(n=>n.state).join(', ')],
    ['Node label','name', nodes.map(n=>n.name).slice(0,4).join(', ')+'…'],
    ['Agent type (styling)','kind', [...new Set(nodes.map(n=>n.kind))].join(', ')],
    ['Detail: model','model', [...new Set(nodes.map(n=>n.model).filter(Boolean))].join(', ')],
    ['Detail: live action','action', 'blocked: confirm token TTL, …'],
    ['Fleet grouping','sessionId', [...new Set(all.body.map(a=>a.sessionId))].join(', ')],
  ];
  document.getElementById('chk').innerHTML = needs.map(([label,field,val])=>
    `<div class="ci"><span class="y">✓</span><div><b>${label}</b> → <code>${field}</code><div class="d">${esc(val)}</div></div></div>`
  ).join('');

  document.getElementById('note').innerHTML =
    'Every field the graph + detail sheet need is present in this one payload. ' +
    'The only thing the detail sheet pulls separately is the <b>per-session diff</b> — a route that already ships: ' +
    '<code>GET /api/sessions/:id/diff/summary</code>. Timestamps <code>startedAt</code>/<code>updatedAt</code> give elapsed. ' +
    'No new server work remains for Phase 3 to read.';

  document.getElementById('foot').textContent =
    'in-process against apps/server/src/server/app.ts on branch feat/agents-graph · no port, no prod daemon touched';
}).catch(e=>{ document.getElementById('json').textContent = 'load error: '+e; });
</script>
</body>
</html>
