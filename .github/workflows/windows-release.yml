name: Windows release

# Pushing the tag windows-vX.Y.Z releases the Windows client (clients/desktop).
# It never matches the iOS release.yml or relay-deploy.yml filter ('v*.*.*'),
# and its release is never marked latest: `releases/latest` stays the iOS app.
#
# Same draft-then-publish shape as release.yml: the draft opens first, the
# build attaches to it, and only a green build takes it out of draft. Installed
# apps update from the rolling `windows-feed` release, moved last.
# Manual runs are build-only: they upload a workflow artifact and touch no release.
on:
  push:
    tags: ['windows-v*.*.*']
  workflow_dispatch:

# The build runs third-party build scripts and tools; only the jobs that write
# releases get a write token.
permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  # Velopack installs to %LOCALAPPDATA%\<packId> and empties it on uninstall, so
  # it must never be "Tether": that folder holds the app's profiles, keys and
  # secrets. Changing it later orphans every existing install.
  PACK_ID: TetherTerminal

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/desktop
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The exe's FileVersion comes from Cargo, so a tag that disagrees with the
      # workspace version would ship a binary that reports another version.
      # tr: the Windows checkout may have CRLF line endings.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)"
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::No version found in clients/desktop/Cargo.toml"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${TAG#windows-v}"
            if [ "$V" != "$CARGO_VERSION" ]; then
              echo "::error::Tag $TAG but clients/desktop/Cargo.toml is $CARGO_VERSION. Bump the workspace version and re-tag."
              exit 1
            fi
          else
            V="$CARGO_VERSION"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $V"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build of the app
        run: cargo build --release --locked -p tether-app

      - name: Package
        shell: pwsh
        run: ./packaging/package.ps1 -Version ${{ steps.ver.outputs.version }} -SkipBuild

      - name: Check the package
        shell: pwsh
        run: ./packaging/check-package.ps1 -Version ${{ steps.ver.outputs.version }}

      # vpk refuses an exe that never calls VelopackApp, so this also proves the
      # updater is wired in. --aumid matches the app's own, or toasts lose their identity.
      - name: Installer and update package
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId $env:PACK_ID --packVersion $env:VERSION `
            --packDir dist/Tether --mainExe Tether.exe --packTitle Tether `
            --icon assets/icons/tether.ico --aumid Tether.Terminal `
            --noPortable --outputDir dist/velopack
          if ($LASTEXITCODE) { throw 'vpk pack failed' }
          Copy-Item "dist/velopack/$env:PACK_ID-win-Setup.exe" "dist/Tether-$env:VERSION-x64-Setup.exe"
          Get-ChildItem dist/velopack

      # The MSIX is unsigned and its manifest publisher is not the unsigned-package
      # OID, so Windows will not install it; it does not ship.
      - name: Checksums
        shell: pwsh
        working-directory: clients/desktop/dist
        run: |
          Get-ChildItem "Tether-*-x64-portable.zip", "Tether-*-x64-Setup.exe" | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tether-windows-${{ steps.ver.outputs.version }}
          path: |
            clients/desktop/dist/Tether-*-x64-portable.zip
            clients/desktop/dist/Tether-*-x64-Setup.exe
            clients/desktop/dist/SHA256SUMS.txt
            clients/desktop/dist/velopack/*-full.nupkg
            clients/desktop/dist/velopack/releases.win.json
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: tether-windows-${{ needs.build.outputs.version }}
          path: dist

      # Notes cover only clients/desktop since the previous Windows tag, so iOS
      # and host-tool commits never land in a Windows release.
      - name: Write notes
        run: |
          set -euo pipefail
          V="${TAG#windows-v}"
          PREV="$(git tag -l 'windows-v*.*.*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)"
          RANGE="${PREV:+$PREV..}$TAG"
          {
            echo "Tether for Windows $V."
            echo
            echo "Install with \`Tether-$V-x64-Setup.exe\` (per-user, no admin); the app then updates itself. \`Tether-$V-x64-portable.zip\` runs without installing but does not update. Neither is code-signed yet, so SmartScreen may warn on first launch."
            echo
            echo "## Changes"
            git log --no-merges --format='- %s' "$RANGE" -- clients/desktop clients/windows
          } > notes.md
          cat notes.md

      # Idempotent: a re-run of a failed workflow reuses the existing draft.
      - name: Open draft release
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --latest=false \
              --title "Tether for Windows ${TAG#windows-v}" --notes-file notes.md
          fi

      - name: Upload assets
        run: gh release upload "$TAG" dist/Tether-*-x64-portable.zip dist/Tether-*-x64-Setup.exe dist/SHA256SUMS.txt --clobber

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest=false

  # Installed apps poll FEED_URL (crates/tether-app/src/updates.rs): this release's
  # fixed download path. One run at a time across all tags, never moved backwards,
  # and the previous package stays one release so a client that read the old feed
  # can still download it.
  feed:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-feed
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FEED: windows-feed
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tether-windows-${{ needs.build.outputs.version }}
          path: dist

      - name: Point the update feed at this version
        run: |
          set -euo pipefail
          if ! gh release view "$FEED" >/dev/null 2>&1; then
            gh release create "$FEED" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Windows update feed" \
              --notes "Read by installed Windows apps to find updates. Download Tether from the windows-v* releases instead."
          fi
          CURRENT=""
          if gh release download "$FEED" -p releases.win.json -O current.json 2>/dev/null; then
            CURRENT="$(jq -r '[.Assets[].Version] | max_by(split(".") | map(tonumber? // 0))' current.json)"
          fi
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$VERSION" ] \
            && [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" = "$CURRENT" ]; then
            echo "Feed already serves $CURRENT, newer than $VERSION; leaving it."
            exit 0
          fi
          NEW="$(basename dist/velopack/*-full.nupkg)"
          gh release upload "$FEED" "dist/velopack/$NEW" --clobber
          gh release upload "$FEED" dist/velopack/releases.win.json --clobber
          gh release view "$FEED" --json assets -q '.assets[].name' \
            | grep -E -- '-full\.nupkg$' | sort -V | head -n -2 \
            | while read -r old; do gh release delete-asset "$FEED" "$old" --yes; done
