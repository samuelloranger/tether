# Beta builds for the native client rewrite.
#
# Deliberately separate from release.yml, which builds the SHIPPING clients
# (apps/mobile — the Expo app and the react-native-web Tauri desktop). This one
# builds the REPLACEMENTS being written in the rewrite: apps/desktop and, once
# it exists, the Swift iOS app. Nothing here touches a GitHub Release; every
# leg uploads workflow artifacts you download and run by hand.
#
# Manual only. These are test builds, not a publishing path.
#
# TestFlight signing secrets. With the first three set, the iOS leg signs with a
# stored identity and creates nothing; without them it falls back to automatic
# signing, which mints a new distribution certificate on EVERY run and will hit
# Apple's per-account cap within a few builds.
#
#   IOS_DIST_CERT_P12_BASE64     Apple Distribution cert + private key, .p12,
#                                base64 (`base64 -i dist.p12 | pbcopy`)
#   IOS_DIST_CERT_PASSWORD       the password set when exporting that .p12
#   IOS_PROVISIONING_PROFILE_BASE64
#                                App Store profile for
#                                com.samuelloranger.tether-mobile, base64
#   APP_STORE_CONNECT_KEY_P8_BASE64 / _KEY_ID / _ISSUER_ID, APPLE_TEAM_ID
#                                unchanged — still needed for upload
name: Beta (native rewrite)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to build
        type: choice
        default: all
        options: [all, core, desktop, ios, testflight]
      version:
        description: >-
          Marketing version for TestFlight (scope=testflight). The native client
          has its own 3.x line, deliberately above the Expo client's 2.8.x so the
          two never interleave on the shared App Store Connect record.
        type: string
        default: '3.0.0'
  # GitHub only exposes workflow_dispatch for workflows that exist on the
  # DEFAULT branch, and this one lives on the rewrite branch. A push trigger
  # runs from the branch's own definition instead, which is how the rewrite
  # gets a real build signal before it is anywhere near main.
  # Generalise or drop this branch list when the rewrite merges.
  push:
    branches:
      - feat/tether-core-p0

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Rust core plus the cross-language conformance suite. Cheap, and it
  # gates the platform legs: if the core is broken there is no point paying for
  # five desktop runners.
  core:
    if: github.event_name == 'push' || inputs.scope == 'all' || inputs.scope == 'core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/tether-core
            crates/tether-proto

      # The conformance test spawns the real Bun server, so workspace deps must
      # be installed before it runs.
      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Core crate
        timeout-minutes: 15
        run: cargo fmt --check && cargo clippy -- -D warnings && cargo test
        working-directory: crates/tether-core

      - name: Proto crate
        timeout-minutes: 15
        run: cargo fmt --check && cargo clippy -- -D warnings && cargo test
        working-directory: crates/tether-proto

      # #[ignore]d in-tree so plain `cargo test` stays hermetic; this is the
      # cross-language check that Rust and the Bun server agree on the v2 wire.
      - name: proto=2 conformance (rust ↔ bun)
        timeout-minutes: 10
        run: cargo test --test proto2_conformance -- --ignored --nocapture
        working-directory: crates/tether-core

  desktop:
    needs: core
    # `needs` alone would skip this when scope=desktop, because core is skipped.
    if: |
      always() && (needs.core.result == 'success' || needs.core.result == 'skipped')
      && (github.event_name == 'push' || inputs.scope == 'all' || inputs.scope == 'desktop')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            cache-key: macos-aarch64
          - os: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            cache-key: macos-x86_64
          - os: windows-latest
            args: ""
            cache-key: windows-x64
          # Split for the same reason release.yml splits: native packages build
          # on the older LTS for the widest glibc range, while the AppImage
          # bundles its own webkit and needs 26.04's newer engine to avoid a
          # blank window on some GPU/compositor combinations.
          - os: ubuntu-24.04
            args: --bundles deb,rpm
            cache-key: linux-deb-rpm
          - os: ubuntu-26.04
            args: --bundles appimage
            cache-key: linux-appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.cache-key }}

      - name: Linux Tauri deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev rpm

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # No tagName/releaseId: beta builds never touch a Release. Unsigned by
      # design — these are for local testing, and an unsigned bundle is the
      # honest artifact for that. Signing belongs to release.yml.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          includeUpdaterJson: false

      # Bundle dir is target/release/bundle without --target, and
      # target/<triple>/release/bundle with one (the macOS legs pass --target).
      - name: Upload beta desktop bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-desktop-${{ matrix.cache-key }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
            apps/desktop/src-tauri/target/*/release/bundle/**

  # iOS. This is the leg that cannot be built or verified on the Linux dev box,
  # which is exactly why it lives here: a macOS runner is the only place the
  # XCFramework can be assembled and any Swift can be compiled.
  #
  # scope=ios — unsigned simulator build (CI signal only).
  # scope=testflight — signed device archive of clients/apple uploaded to the
  #   SAME App Store Connect app as the shipping Expo client (6800525706).
  #   Dispatch-only; never runs on push. Never touches a GitHub Release.
  #
  # crates/tether-ffi and clients/apple land in later sprints. Rather than fail
  # a run for work that has not been written yet, each stage checks for its
  # inputs and reports plainly when it is not there. When the sprint lands, this
  # job starts doing real work with no edit.
  ios:
    needs: core
    # OPT-IN ONLY. Deliberately NOT run on push, and not part of scope=all.
    # iOS is built on a real Mac locally (see scripts/build-xcframework.sh);
    # burning macOS runner minutes to rediscover what a local Xcode reports in
    # seconds is the wrong trade. Dispatch with scope=ios (simulator) or
    # scope=testflight (signed upload) when you want CI to confirm it.
    if: |
      always() && (needs.core.result == 'success' || needs.core.result == 'skipped')
      && (inputs.scope == 'ios' || inputs.scope == 'testflight')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tether-core
          key: ios

      - name: What exists in this commit
        id: probe
        run: |
          ffi=false; app=false
          [ -f crates/tether-ffi/Cargo.toml ] && ffi=true
          [ -d clients/apple ] && app=true
          echo "ffi=$ffi" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "tether-ffi crate present: $ffi"
          echo "clients/apple present:    $app"

      # Always runs: the core itself must cross-compile to a device target long
      # before any Swift exists. This is the earliest possible signal that the
      # core is actually iOS-portable, and it would have caught a host-only
      # dependency sneaking in.
      - name: Cross-compile tether-core for iOS (device)
        timeout-minutes: 20
        run: cargo build --target aarch64-apple-ios --release
        working-directory: crates/tether-core

      - name: Cross-compile tether-core for the simulator
        timeout-minutes: 20
        run: cargo build --target aarch64-apple-ios-sim --release
        working-directory: crates/tether-core

      - name: Build tether-ffi and assemble the XCFramework
        if: steps.probe.outputs.ffi == 'true'
        timeout-minutes: 30
        run: bash scripts/build-xcframework.sh

      # Unsigned simulator build — scope=ios only. Unchanged from the original
      # beta lane; signing and TestFlight live exclusively under scope=testflight.
      - name: Build the iOS app (simulator)
        if: inputs.scope == 'ios' && steps.probe.outputs.app == 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          xcodebuild -project clients/apple/Tether.xcodeproj \
            -scheme TetherIOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # --- TestFlight lane (scope=testflight only; unreachable on push) ---
      # Shares ASC app 6800525706 / bundle id com.samuelloranger.tether-mobile
      # with release.yml. Signing mirrors release.yml's ios job exactly.
      # Build number is 900000 + run_number so it never collides with
      # release.yml's plain run_number counter on the same ASC record.

      - name: Resolve version and build number
        if: inputs.scope == 'testflight'
        id: ver
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Falls back rather than reading apps/mobile/app.json: the native client
          # tracks its own 3.x line, not the Expo client's shipping version.
          V="${VERSION_INPUT:-3.0.0}"
          B=$((900000 + RUN_NUMBER))
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$B" >> "$GITHUB_OUTPUT"
          echo "Building $V ($B)"

      # altool discovers the key by ID under ~/.appstoreconnect/private_keys;
      # xcodebuild wants an explicit path. Write it once, satisfy both.
      - name: Install App Store Connect API key
        if: inputs.scope == 'testflight'
        env:
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

      # Why this exists: with CODE_SIGN_STYLE=Automatic and
      # -allowProvisioningUpdates, Xcode looks for a distribution identity in the
      # runner's keychain, finds none — the runner is ephemeral, so the private
      # key never survives — and asks App Store Connect to CREATE one. Every run.
      # Apple caps distribution certificates per account, so after a handful of
      # builds signing fails outright and the only cure is revoking certificates
      # by hand in the developer portal. That happened during this pipeline's
      # first day.
      #
      # A persisted identity fixes it at the root: import one certificate and one
      # profile from secrets, sign manually, create nothing. The automatic path
      # is kept as a fallback so the workflow still runs before the secrets are
      # configured — but it is the path that burns certificates, so the log says
      # so loudly.
      - name: Detect signing mode
        id: signing
        if: inputs.scope == 'testflight' && steps.probe.outputs.app == 'true'
        env:
          HAS_CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_CERT" = "true" ]; then
            echo 'mode=manual' >> "$GITHUB_OUTPUT"
            echo 'Signing manually with the stored identity — no certificate will be created.'
          else
            echo 'mode=automatic' >> "$GITHUB_OUTPUT"
            echo '::warning::No IOS_DIST_CERT_P12_BASE64 / IOS_PROVISIONING_PROFILE_BASE64 secret set.'
            echo '::warning::Falling back to automatic signing, which MINTS A NEW CERTIFICATE on every run and will hit Apple'"'"'s per-account cap.'
          fi

      - name: Install signing identity
        if: steps.signing.outputs.mode == 'manual'
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # A throwaway keychain, not the login one: it is deleted in a
          # post-job step, and nothing else on the runner should see this key.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN=~/Library/Keychains/tether-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_B64" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f /tmp/dist.p12
          # Without this, codesign prompts for keychain access and hangs the job.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Search list, not default-keychain: xcodebuild reads the search list,
          # and replacing the default breaks other tooling on the runner.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES"
          printf '%s' "$PROFILE_B64" | base64 --decode > /tmp/profile.mobileprovision
          # The profile's own name is what PROVISIONING_PROFILE_SPECIFIER wants,
          # and its UUID is the filename Xcode looks for. Read both out of the
          # profile rather than hard-coding them, so rotating it needs no edit here.
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)"
          cp /tmp/profile.mobileprovision "$PROFILES/$UUID.mobileprovision"
          rm -f /tmp/profile.plist /tmp/profile.mobileprovision
          echo "PROVISIONING_PROFILE_SPECIFIER=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile '$NAME' ($UUID)"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/([0-9A-F]*)/(…)/'

      - name: Build signed archive
        if: inputs.scope == 'testflight' && steps.probe.outputs.app == 'true'
        timeout-minutes: 45
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.ver.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ steps.ver.outputs.build }}
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          # Manual signing passes NO -allowProvisioningUpdates and no API key:
          # that flag is what lets Xcode create a certificate, so withholding it
          # is the fix rather than an optimisation. Automatic keeps both, and
          # keeps the cost that comes with them.
          if [ "$SIGN_MODE" = manual ]; then
            xcodebuild -project clients/apple/Tether.xcodeproj \
              -scheme TetherIOS \
              -configuration Release -sdk iphoneos \
              -archivePath build/TetherIOS.xcarchive archive \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
              MARKETING_VERSION="$MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
          else
            xcodebuild -project clients/apple/Tether.xcodeproj \
              -scheme TetherIOS \
              -configuration Release -sdk iphoneos \
              -archivePath build/TetherIOS.xcarchive archive \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              MARKETING_VERSION="$MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
          fi

      - name: Export IPA
        if: inputs.scope == 'testflight' && steps.probe.outputs.app == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
          BUNDLE_ID: com.samuelloranger.tether-mobile
        run: |
          set -euo pipefail
          # The export has to agree with how the archive was signed, or it
          # re-resolves the identity and can mint a certificate at THIS step
          # instead — the same cap, one stage later.
          if [ "$SIGN_MODE" = manual ]; then
            cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROVISIONING_PROFILE_SPECIFIER</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath build/TetherIOS.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist ExportOptions.plist
          else
            cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath build/TetherIOS.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist ExportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID"
          fi

      # if: always() — a failed archive still leaves the key on the runner, and
      # the runner image is reused within a job even though it is discarded after.
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.mode == 'manual'
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain ~/Library/Keychains/tether-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true

      - name: Validate build
        if: inputs.scope == 'testflight' && steps.probe.outputs.app == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find build/export -name '*.ipa' | head -1)"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # continue-on-error: a rejected upload must not wipe the IPA artifact step
      # below. Uploading still consumes a real build number on the live ASC
      # record — treat every dispatch as permanent.
      - name: Upload to TestFlight
        if: inputs.scope == 'testflight' && steps.probe.outputs.app == 'true'
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find build/export -name '*.ipa' | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload TestFlight artifacts
        if: always() && inputs.scope == 'testflight'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-ios-testflight-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/export/*.ipa
            build/TetherIOS.xcarchive

      - name: Not-yet-written stages
        if: steps.probe.outputs.ffi != 'true' || steps.probe.outputs.app != 'true'
        run: |
          echo "::notice::iOS legs skipped for work not yet in this commit."
          echo "  tether-ffi crate:  ${{ steps.probe.outputs.ffi }}"
          echo "  clients/apple:     ${{ steps.probe.outputs.app }}"
          echo "The tether-core cross-compile above DID run and is a real signal."

      - name: Upload beta iOS artifacts
        if: steps.probe.outputs.ffi == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-ios-${{ github.sha }}
          if-no-files-found: warn
          path: |
            clients/apple/TetherKit/Frameworks/**
            build/**/*.xcframework/**
