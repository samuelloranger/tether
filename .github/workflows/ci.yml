name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun lint

  # The only shipping product: the native Swift client. This assembles the
  # XCFramework from crates/ (the compile check for tether-ffi/core/proto), then
  # builds TetherIOS for the simulator and runs the TetherKit tests. Signing is
  # off — this proves the sources compile and render, nothing more.
  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tether-core
          shared-key: tether-ios-ci
          cache-on-failure: true

      - name: Build tether-ffi and assemble the XCFramework
        timeout-minutes: 30
        env:
          PROFILE: debug
        run: bash scripts/build-xcframework.sh

      - name: Build TetherIOS for the simulator
        timeout-minutes: 30
        run: |
          xcodebuild build \
            -project clients/apple/Tether.xcodeproj \
            -scheme TetherIOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: TetherKit tests on the simulator
        timeout-minutes: 20
        run: |
          xcodebuild test \
            -scheme TetherKit \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
        working-directory: clients/apple/TetherKit
