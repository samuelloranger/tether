name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun lint

      - name: Release script tests
        run: bun test scripts/

      - name: Relay tests
        working-directory: apps/relay
        run: |
          bun install --frozen-lockfile
          bunx wrangler types --check
          ../../node_modules/.bin/tsc --noEmit -p tsconfig.json
          ../../node_modules/.bin/tsc --noEmit -p tsconfig.test.json
          bun test

  # Host CLI: the Go encrypted-push tool (apps/tether-notify). Build, vet, and
  # run its crypto/devices tests.
  host-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: apps/tether-notify/go.mod

      - name: Build, vet, and test tether-notify
        working-directory: apps/tether-notify
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # The shipping product: the native Swift client. Builds TetherIOS for the
  # simulator and runs the TetherKit tests. Signing is off — this proves the
  # sources compile and render, nothing more.
  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Build TetherIOS for the simulator
        timeout-minutes: 30
        run: |
          xcodebuild build \
            -skipPackagePluginValidation \
            -project clients/apple/Tether.xcodeproj \
            -scheme TetherIOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: TetherKit tests on the simulator
        timeout-minutes: 20
        run: |
          xcodebuild test \
            -skipPackagePluginValidation \
            -scheme TetherKit \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
        working-directory: clients/apple/TetherKit

  # The Windows client. Lints and tests the whole workspace and builds the app
  # in release; tether-app is the only crate that needs Windows.
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/windows

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build of the app
        run: cargo build --release -p tether-app

  # The Windows client's library crates hold no Win32 code outside cfg(windows),
  # so they must also build and pass on Linux.
  windows-libs-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/windows

      - name: Clippy
        run: cargo clippy -p tether-core -p tether-ssh -p tether-term --all-targets -- -D warnings

      - name: Test
        run: cargo test -p tether-core -p tether-ssh -p tether-term
