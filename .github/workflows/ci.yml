name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun lint

      - name: Release script tests
        run: bun test scripts/

      - name: Relay tests
        working-directory: apps/relay
        run: |
          bun install --frozen-lockfile
          bunx wrangler types --check
          ../../node_modules/.bin/tsc --noEmit -p tsconfig.json
          ../../node_modules/.bin/tsc --noEmit -p tsconfig.test.json
          bun test

  # Host CLI: the Go encrypted-push tool (apps/tether-notify). Build, vet, and
  # run its crypto/devices tests.
  host-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: apps/tether-notify/go.mod

      - name: Build, vet, and test tether-notify
        working-directory: apps/tether-notify
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # The shipping product: the native Swift client. Builds TetherIOS for the
  # simulator and Mac Catalyst and runs the TetherKit tests. Signing is off — this proves the
  # sources compile and render, nothing more.
  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Build TetherIOS for the simulator
        timeout-minutes: 30
        run: |
          xcodebuild build \
            -skipPackagePluginValidation \
            -project clients/apple/Tether.xcodeproj \
            -scheme TetherIOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build TetherIOS for Mac Catalyst
        timeout-minutes: 30
        run: |
          xcodebuild build \
            -skipPackagePluginValidation \
            -project clients/apple/Tether.xcodeproj \
            -scheme TetherIOS \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # Pinned runtime: the snapshot references are recorded on it, and the snapshot tests
      # skip themselves anywhere else.
      - name: TetherKit tests on the simulator
        timeout-minutes: 20
        run: |
          xcodebuild test \
            -skipPackagePluginValidation \
            -scheme TetherKit \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=26.2' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
        working-directory: clients/apple/TetherKit

  # The Windows client. Lints and tests the whole workspace and builds the app
  # in release; tether-app is the only crate that needs Windows.
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build of the app
        run: cargo build --release -p tether-app

      - name: Package (portable zip + unsigned MSIX)
        shell: pwsh
        run: ./packaging/package.ps1 -Version 0.0.${{ github.run_number }} -SkipBuild

      - name: Check the package
        shell: pwsh
        run: ./packaging/check-package.ps1 -Version 0.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: tether-windows-${{ github.run_number }}
          path: |
            clients/desktop/dist/Tether-*-x64-portable.zip
            clients/desktop/dist/Tether-*-x64.msix
          if-no-files-found: error

  # The desktop client builds, lints and tests on Linux as well as Windows, and ships there
  # as an AppImage.
  desktop-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    defaults:
      run:
        # A container job runs steps with sh, which has no pipefail.
        shell: bash
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The build runs in ubuntu:22.04 so the binary links glibc 2.35 and starts on every distro
      # at least that recent; a build on ubuntu-latest would refuse to start on an LTS a release
      # or two behind. The container is used because the ubuntu-22.04 runner image is being
      # retired, and the Windows release waits on this job. fontconfig is the only system library
      # linked at build time (it brings the freetype and expat headers); the windowing, GL and
      # D-Bus libraries are loaded at run time. squashfs-tools and the .NET SDK are for vpk, and the
      # colour emoji font is what the glyph test expects a desktop to have.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libfontconfig1-dev \
            squashfs-tools dotnet-sdk-8.0 fonts-noto-color-emoji

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build of the app
        run: cargo build --release --locked -p tether-app

      - name: AppImage
        run: |
          dotnet tool install -g vpk --version 1.2.161
          PATH="$HOME/.dotnet/tools:$PATH" packaging/linux/package.sh --skip-build

      - uses: actions/upload-artifact@v4
        with:
          name: tether-linux-appimage
          path: clients/desktop/dist/Tether-*-x86_64.AppImage
          if-no-files-found: error
