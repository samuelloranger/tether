name: Release builds

# scripts/release.sh pushes the tag vX.Y.Z, which starts this workflow. The
# `draft` job opens a DRAFT release, the artifact jobs attach every desktop, iOS
# and server artifact to it, and only when all of them succeed does
# `publish` take it out of draft. A failed build therefore can never become the
# public `releases/latest` that install.sh and `tether update` resolve stable
# asset names from (how v2.0.0 shipped with every desktop bundle broken).
# Manual runs are build-only: they upload workflow artifacts without touching a
# release.
#
# Why a tag push and not a `release` event: GitHub does not run workflows for
# draft releases at all — the `created`, `edited`, and `deleted` activity types
# are suppressed for drafts, and only `published` fires, which is far too late to
# gate on. So CI cannot be triggered BY a draft; it has to CREATE the draft. A
# bare tag is safe to publish early because install.sh and `tether update` both
# resolve the releases API, which never sees a tag that has no published release.
#
# Caches: tag runs can restore from the default branch only — not from sibling
# tags. CI on main (cache-warm) writes bun/rust into that scope; release
# jobs restore them. rust-cache uses shared-key (stable across job names) and
# cache-on-failure so a flaky asset upload does not discard a finished compile.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      scope:
        description: Artifacts to build without publishing
        type: choice
        options:
          - desktop
          - ios
          - testflight
          - all
        default: desktop

permissions:
  contents: write

# On a tag push github.ref_name IS vX.Y.Z; on a manual run it is the branch.
env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # Opens the draft the artifact jobs upload into, and hands them its id. Runs on
  # manual dispatch too (as a no-op) so that `needs: draft` never resolves to
  # "skipped" — a skipped dependency would skip every job downstream of it.
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.open.outputs.id }}
    steps:
      - name: Open draft release
        id: open
        if: github.event_name == 'push'
        run: |
          # Idempotent: a re-run of a failed workflow reuses the existing draft
          # rather than erroring on a duplicate tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Reusing existing release $TAG"
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  # Builds apps/desktop — the native Tauri client (vite + xterm.js over
  # tether-core). iOS ships from clients/apple; Android is decommissioned.
  #
  # apps/desktop deliberately keeps the OLD bundle identifier
  # (cloud.samlo.tether). The identifier is what names the webview data
  # directory, and the app's own host-profile migration reads the previous app's
  # localStorage (tether_host_profiles) out of it — so a user updating in place
  # keeps their hosts. It is also what NSIS uses for the install path and
  # uninstall registry key, so a new identifier would install beside the old app
  # on Windows instead of upgrading it.
  #
  desktop:
    needs: draft
    if: github.event_name == 'push' || inputs.scope == 'desktop' || inputs.scope == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            cache-key: macos-aarch64
          - os: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            cache-key: macos-x86_64
          - os: windows-latest
            args: ""
            cache-key: windows-x64
          # Native packages depend on the system webkit, so build them on the
          # older LTS for the widest glibc range (works on 24.04, Debian 12,
          # Fedora, etc.). They don't bundle an engine, so the runner's webkit
          # version is irrelevant here.
          - os: ubuntu-24.04
            args: --bundles deb,rpm
            cache-key: linux-deb-rpm
          # The AppImage bundles its OWN webkit (via linuxdeploy). The 24.04
          # engine (webkit2gtk 2.44) can't create an EGL display on some
          # GPU/compositor combos (e.g. hybrid Intel+NVIDIA on Wayland) and
          # renders a blank/gray window. 26.04 ships webkit2gtk 2.52, which
          # fixes it. Cost: a higher glibc floor — but that only affects the
          # AppImage; native-package users are unaffected.
          - os: ubuntu-26.04
            args: --bundles appimage
            cache-key: linux-appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      # Cargo registry + target artifacts. shared-key (not key) so CI on main can
      # warm the same entries tag releases restore — tag scopes can't read sibling
      # tags, only the default branch. cache-on-failure: flaky release-asset uploads
      # must not throw away a successful compile.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: tether-${{ matrix.cache-key }}
          cache-on-failure: true

      # webkit/gtk to build; `rpm` so the .rpm bundle is produced (AppImage
      # tooling is fetched by tauri). The Linux build is split across two runners
      # (see the matrix): 24.04 emits .deb/.rpm, 26.04 emits the .AppImage with a
      # newer bundled webkit. Same deps on both.
      - name: Linux Tauri deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev rpm

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # On a tag push, upload bundles onto the draft opened by the `draft` job.
      # Manual runs get an empty releaseId, so they build without touching it.
      # Signing is opt-in via repo secrets (safe in a public repo — Actions
      # secrets are encrypted and never exposed to fork PRs). When a secret is
      # absent the step still builds, just unsigned:
      #   - TAURI_SIGNING_PRIVATE_KEY(+ _PASSWORD): signs update artifacts and
      #     emits latest.json — REQUIRED for the in-app auto-updater to work.
      #   - APPLE_* : Developer ID signing + notarization (clears macOS Gatekeeper).
      #   - Windows signing needs a separate approach (Azure Trusted Signing or a
      #     pfx + certificateThumbprint in tauri.conf); left unsigned for now.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.event_name == 'push' && env.TAG || '' }}
          releaseId: ${{ needs.draft.outputs.release_id }}
          # Each leg uploads its own bundles and .sig files, whose names never
          # collide. latest.json is the one asset they would all share, and
          # tauri-action maintains it by read-modify-write (fetch, merge in this
          # platform, delete, re-upload) — so with the legs in parallel they race
          # on it. v2.8.11 hit both outcomes: a leg deleted the asset another was
          # reading and failed the run *after* uploading its bundles, and a lost
          # update can silently drop a platform, which breaks in-app updates for
          # it with no failed job to notice. The `publish` job builds the
          # manifest once instead, from the signed bundles on the release.
          includeUpdaterJson: false

      # tauri-action has no built-in workflow-artifact upload; on manual runs,
      # upload the built bundles so they can be downloaded and tested. The
      # bundle dir is target/release/bundle (no --target) or
      # target/<triple>/release/bundle (macOS builds pass --target).
      - name: Upload desktop bundles (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
            apps/desktop/src-tauri/target/*/release/bundle/**
          if-no-files-found: error

  # iOS = the native Swift client in clients/apple. It replaced the Expo iOS app
  # at 3.0.0. Both have uploaded to the same App Store Connect record
  # (6800525706, bundle id com.samuelloranger.tether-mobile), so build numbers
  # must never repeat: github.run_number is monotonic per workflow and survives
  # re-runs of the same tag, which a commit count or timestamp would not. The
  # deleted beta workflow used 900000+run_number to stay clear of this counter;
  # nothing else uploads now, so plain run_number is free again and cannot
  # collide with those.
  #
  # TetherKit links tether-ffi as a SwiftPM .binaryTarget, so xcodebuild uses
  # whatever XCFramework is on disk. Nothing under crates/ reaches the app until
  # build-xcframework.sh has run — a change that compiles and passes cargo test
  # is otherwise simply absent from the build. It is assembled below, in this
  # run, from this commit.
  #
  # `publish` needs this job, so the TestFlight upload is continue-on-error: a
  # rejected or flaky Apple upload must never hold back the GitHub release that
  # install.sh resolves the server binaries from.
  ios:
    needs: draft
    if: github.event_name == 'push' || inputs.scope == 'ios' || inputs.scope == 'testflight' || inputs.scope == 'all'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tether-core
          shared-key: tether-ios
          cache-on-failure: true

      - name: Build tether-ffi and assemble the XCFramework
        timeout-minutes: 30
        run: bash scripts/build-xcframework.sh

      # Marketing version comes from the tag; a manual run has no tag, so it
      # falls back to the repo version rather than whatever is committed in the
      # Xcode project.
      - name: Resolve version and build number
        id: ver
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${TAG#v}"
          else
            V="$(jq -r .version package.json)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building $V ($RUN_NUMBER)"

      # altool discovers the key by ID under ~/.appstoreconnect/private_keys;
      # xcodebuild wants an explicit path. Write it once, satisfy both.
      - name: Install App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

      # Why this exists: with CODE_SIGN_STYLE=Automatic and
      # -allowProvisioningUpdates, Xcode looks for a distribution identity in the
      # runner's keychain, finds none — the runner is ephemeral, so the private
      # key never survives — and asks App Store Connect to CREATE one. Every run.
      # Apple caps distribution certificates per account, so after a handful of
      # builds signing fails outright and the only cure is revoking certificates
      # by hand in the developer portal. That has already happened once here.
      #
      # A persisted identity fixes it at the root: import one certificate and one
      # profile from secrets, sign manually, create nothing. The automatic path
      # stays as a fallback so a release still cuts before the secrets are
      # configured — but it is the path that burns certificates, so the log says
      # so loudly.
      #
      #   IOS_DIST_CERT_P12_BASE64   Apple Distribution cert + key, .p12, base64
      #   IOS_DIST_CERT_PASSWORD     the password used to export that .p12
      #   IOS_PROVISIONING_PROFILE_BASE64
      #                              App Store profile for
      #                              com.samuelloranger.tether-mobile, base64
      #   IOS_NSE_PROVISIONING_PROFILE_BASE64
      #                              App Store profile for
      #                              com.samuelloranger.tether-mobile.TetherNotificationService,
      #                              base64 (required once the NSE ships in the archive)
      - name: Detect signing mode
        id: signing
        env:
          HAS_CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_CERT" = "true" ]; then
            echo 'mode=manual' >> "$GITHUB_OUTPUT"
            echo 'Signing manually with the stored identity — no certificate will be created.'
          else
            echo 'mode=automatic' >> "$GITHUB_OUTPUT"
            echo '::warning::No IOS_DIST_CERT_P12_BASE64 / IOS_PROVISIONING_PROFILE_BASE64 secret set.'
            echo '::warning::Falling back to automatic signing, which MINTS A NEW CERTIFICATE on every run and will hit Apple'"'"'s per-account cap.'
          fi

      - name: Install signing identity
        if: steps.signing.outputs.mode == 'manual'
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          NSE_PROFILE_B64: ${{ secrets.IOS_NSE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # A throwaway keychain, not the login one: it is deleted in a later
          # step, and nothing else on the runner should see this key.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN=~/Library/Keychains/tether-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_B64" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f /tmp/dist.p12
          # Without this, codesign prompts for keychain access and hangs the job.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Search list, not default-keychain: xcodebuild reads the search list,
          # and replacing the default breaks other tooling on the runner.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          install_profile() {
            local b64="$1"
            local env_key="$2"
            PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
            mkdir -p "$PROFILES"
            printf '%s' "$b64" | base64 --decode > /tmp/profile.mobileprovision
            security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
            UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)"
            NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)"
            cp /tmp/profile.mobileprovision "$PROFILES/$UUID.mobileprovision"
            rm -f /tmp/profile.plist /tmp/profile.mobileprovision
            echo "${env_key}=$NAME" >> "$GITHUB_ENV"
            echo "Installed profile '$NAME' ($UUID) → $env_key"
          }

          install_profile "$PROFILE_B64" APP_PROVISIONING_PROFILE_SPECIFIER
          if [ -n "${NSE_PROFILE_B64:-}" ]; then
            install_profile "$NSE_PROFILE_B64" NSE_PROVISIONING_PROFILE_SPECIFIER
          else
            echo '::warning::IOS_NSE_PROVISIONING_PROFILE_BASE64 unset — archive will fail once the Notification Service Extension is required.'
          fi
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/([0-9A-F]*)/(…)/'

      - name: Build signed archive
        timeout-minutes: 45
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.ver.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ steps.ver.outputs.build }}
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          # Manual signing passes NO -allowProvisioningUpdates and no API key:
          # that flag is what lets Xcode create a certificate, so withholding it
          # is the fix rather than an optimisation. Automatic keeps both, and
          # keeps the cost that comes with them.
          #
          # Never pass PROVISIONING_PROFILE_SPECIFIER on the xcodebuild command
          # line: that setting applies to EVERY target and would force the NSE
          # to the app's profile. Each target expands its own user-defined
          # variable instead (APP_… / NSE_…).
          if [ "$SIGN_MODE" = manual ]; then
            xcodebuild -project clients/apple/Tether.xcodeproj \
              -scheme TetherIOS \
              -configuration Release -sdk iphoneos \
              -archivePath build/TetherIOS.xcarchive archive \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              APP_PROVISIONING_PROFILE_SPECIFIER="$APP_PROVISIONING_PROFILE_SPECIFIER" \
              NSE_PROVISIONING_PROFILE_SPECIFIER="${NSE_PROVISIONING_PROFILE_SPECIFIER:-}" \
              MARKETING_VERSION="$MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
          else
            xcodebuild -project clients/apple/Tether.xcodeproj \
              -scheme TetherIOS \
              -configuration Release -sdk iphoneos \
              -archivePath build/TetherIOS.xcarchive archive \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              MARKETING_VERSION="$MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
          fi

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
          BUNDLE_ID: com.samuelloranger.tether-mobile
          NSE_BUNDLE_ID: com.samuelloranger.tether-mobile.TetherNotificationService
        run: |
          set -euo pipefail
          # The export has to agree with how the archive was signed, or it
          # re-resolves the identity and can mint a certificate at THIS step
          # instead — the same cap, one stage later.
          if [ "$SIGN_MODE" = manual ]; then
            NSE_PROFILE_ENTRY=""
            if [ -n "${NSE_PROVISIONING_PROFILE_SPECIFIER:-}" ]; then
              NSE_PROFILE_ENTRY="<key>$NSE_BUNDLE_ID</key><string>$NSE_PROVISIONING_PROFILE_SPECIFIER</string>"
            fi
            cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$APP_PROVISIONING_PROFILE_SPECIFIER</string>
              $NSE_PROFILE_ENTRY
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath build/TetherIOS.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist ExportOptions.plist
          else
            cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath build/TetherIOS.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist ExportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID"
          fi

      # if: always() — a failed archive still leaves the key on the runner, and
      # the runner image is reused within a job even though it is discarded after.
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.mode == 'manual'
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain ~/Library/Keychains/tether-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true

      - name: Validate build
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find build/export -name '*.ipa' | head -1)"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # continue-on-error: `publish` gates on this job, and a rejected upload
      # (duplicate build number, Apple outage, ITMS review rule) must not strand
      # the release in draft with every other artifact already attached.
      # scope=testflight uploads on a manual run too, so the path can be proven
      # without cutting a version; that consumes a build number, which is why
      # plain scope=ios and scope=all do not.
      - name: Upload to TestFlight
        if: github.event_name == 'push' || inputs.scope == 'testflight'
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find build/export -name '*.ipa' | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload IPA workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tether-ios-${{ github.sha }}
          path: build/export/*.ipa

  server:
    needs: draft
    if: github.event_name == 'push' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # x64 uses -baseline (no AVX2 requirement) so the single x64 asset runs
          # on older CPUs too; arm64 has no such split.
          - target: bun-linux-x64-baseline
            asset: tether-linux-x64
          - target: bun-linux-arm64
            asset: tether-linux-arm64
          - target: bun-darwin-arm64
            asset: tether-darwin-arm64
          - target: bun-darwin-x64-baseline
            asset: tether-darwin-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - name: Install workspace deps
        run: bun install --frozen-lockfile
      # The asset name embeds the tag. macOS ships a .tar.gz wrapping a stable
      # inner `tether`: a raw Mach-O can't survive a browser download — GitHub
      # release assets drop the exec bit and the browser stamps
      # com.apple.quarantine, so the adhoc-signed binary won't run. CLI
      # `tar xzf` restores the exec bit and does NOT propagate quarantine.
      # (Double-clicking the archive in Finder still quarantines; only Developer
      # ID notarization clears that.) Linux ships the raw binary (chmod +x is
      # enough there). install.sh and `tether update` mirror this branch.
      - name: Compile ${{ matrix.asset }}
        working-directory: apps/server
        run: |
          # The relay URL is stamped in here rather than configured per server:
          # only the relay holding the APNs key for this app's signing identity
          # can deliver to the released build. Override with the
          # TETHER_PUSH_RELAY_URL repo variable to cut binaries for a fork with
          # its own Apple team; TETHER_PUSH_RELAY_URL in the server's env still
          # wins at runtime.
          bun build --compile --minify \
            --target=${{ matrix.target }} \
            --define 'process.env.TETHER_VERSION="'"${TAG}"'"' \
            --define 'process.env.TETHER_DEFAULT_PUSH_RELAY_URL="'"${RELAY_URL}"'"' \
            --outfile tether \
            src/server/main.ts
          # Stable (un-versioned) name — makes
          # github.com/.../releases/latest/download/<name> a one-click link, and
          # is what `tether update` (v1.13.0+) resolves. The transitional
          # versioned copy was dropped after v1.13.0 carried both names.
          case "${{ matrix.asset }}" in
            *darwin*)
              out="${{ matrix.asset }}.tar.gz"
              tar czf "$out" tether ;;
            *)
              out="${{ matrix.asset }}"
              mv tether "$out" ;;
          esac
          echo "ASSET=$out" >> "$GITHUB_ENV"
        env:
          RELAY_URL: ${{ vars.TETHER_PUSH_RELAY_URL || 'https://tether-relay.samlo.cloud' }}
      - name: Checksum ${{ matrix.asset }}
        working-directory: apps/server
        run: sha256sum "$ASSET" > "$ASSET.sha256"
      - name: Attach to release
        if: github.event_name == 'push'
        working-directory: apps/server
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload server workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}-${{ github.sha }}
          path: apps/server/${{ env.ASSET }}

  # The gate. Every artifact job must succeed before the release stops being a
  # draft — and publishing is also what creates the git tag (at the commit
  # release.sh passed as --target). Until this runs, `releases/latest` still points
  # at the previous good release, so install.sh and `tether update` keep working
  # even if a build leg fails.
  publish:
    if: github.event_name == 'push'
    needs: [desktop, ios, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # The single writer of latest.json — see includeUpdaterJson in `desktop`.
      # Runs before the release leaves draft, and refuses to emit a manifest
      # that is missing a platform, so an incomplete updater manifest holds the
      # release as a draft instead of stranding those users on the old version.
      - name: Build the updater manifest
        run: bun scripts/build-updater-manifest.ts "$TAG" latest.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach the updater manifest
        run: gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
