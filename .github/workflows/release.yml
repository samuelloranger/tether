name: Release builds

# scripts/release.sh pushes the tag vX.Y.Z, which starts this workflow. The
# `draft` job opens a DRAFT release, `ios` attaches the build to it, and only
# when it succeeds does `publish` take it out of draft. A failed build therefore
# never becomes the public `releases/latest`. Manual runs are build-only: they
# upload workflow artifacts without touching a release.
#
# Why a tag push and not a `release` event: GitHub does not run workflows for
# draft releases, so CI cannot be triggered BY a draft; it has to CREATE the
# draft.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      scope:
        description: Artifacts to build without publishing
        type: choice
        options:
          - ios
          - testflight
        default: ios

permissions:
  contents: write

# On a tag push github.ref_name IS vX.Y.Z; on a manual run it is the branch.
env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # Opens the draft the ios job uploads into, and hands it its id. Runs on manual
  # dispatch too (as a no-op) so `needs: draft` never resolves to "skipped".
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.open.outputs.id }}
    steps:
      - name: Open draft release
        id: open
        if: github.event_name == 'push'
        run: |
          # Idempotent: a re-run of a failed workflow reuses the existing draft
          # rather than erroring on a duplicate tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Reusing existing release $TAG"
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  # iOS = the native Swift client in clients/apple, the only shipping product.
  # It uploads to App Store Connect (6800525706, com.samuelloranger.tether-mobile),
  # so build numbers must never repeat: github.run_number is monotonic per
  # workflow and survives re-runs of the same tag.
  #
  # `publish` needs this job, so the TestFlight upload is continue-on-error: a
  # rejected or flaky Apple upload must never hold back the GitHub release.
  ios:
    needs: draft
    if: github.event_name == 'push' || inputs.scope == 'ios' || inputs.scope == 'testflight'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # Marketing version comes from the tag; a manual run has no tag, so it
      # falls back to the repo version rather than whatever is committed in the
      # Xcode project.
      - name: Resolve version and build number
        id: ver
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${TAG#v}"
          else
            V="$(jq -r .version package.json)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building $V ($RUN_NUMBER)"

      # altool discovers the key by ID under ~/.appstoreconnect/private_keys;
      # xcodebuild wants an explicit path. Write it once, satisfy both.
      - name: Install App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

      # A persisted identity avoids minting a new distribution certificate every
      # run (Apple caps them per account). Import one certificate and one profile
      # from secrets, sign manually, create nothing. The automatic path stays as a
      # fallback so a release still cuts before the secrets are configured — but it
      # is the path that burns certificates, so the log says so loudly.
      #
      #   IOS_DIST_CERT_P12_BASE64   Apple Distribution cert + key, .p12, base64
      #   IOS_DIST_CERT_PASSWORD     the password used to export that .p12
      #   IOS_PROVISIONING_PROFILE_BASE64
      #                              App Store profile for
      #                              com.samuelloranger.tether-mobile, base64
      #   IOS_NSE_PROVISIONING_PROFILE_BASE64
      #                              App Store profile for the
      #                              TetherNotificationService extension, base64
      - name: Detect signing mode
        id: signing
        env:
          HAS_CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_CERT" = "true" ]; then
            echo 'mode=manual' >> "$GITHUB_OUTPUT"
            echo 'Signing manually with the stored identity — no certificate will be created.'
          else
            echo 'mode=automatic' >> "$GITHUB_OUTPUT"
            echo '::warning::No IOS_DIST_CERT_P12_BASE64 / IOS_PROVISIONING_PROFILE_BASE64 secret set.'
            echo '::warning::Falling back to automatic signing, which MINTS A NEW CERTIFICATE on every run and will hit Apple'"'"'s per-account cap.'
          fi

      - name: Install signing identity
        if: steps.signing.outputs.mode == 'manual'
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          NSE_PROFILE_B64: ${{ secrets.IOS_NSE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # A throwaway keychain, not the login one: it is deleted in a later
          # step, and nothing else on the runner should see this key.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN=~/Library/Keychains/tether-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_B64" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f /tmp/dist.p12
          # Without this, codesign prompts for keychain access and hangs the job.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Search list, not default-keychain: xcodebuild reads the search list,
          # and replacing the default breaks other tooling on the runner.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          install_profile() {
            local b64="$1"
            local env_key="$2"
            PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
            mkdir -p "$PROFILES"
            printf '%s' "$b64" | base64 --decode > /tmp/profile.mobileprovision
            security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
            UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)"
            NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)"
            cp /tmp/profile.mobileprovision "$PROFILES/$UUID.mobileprovision"
            rm -f /tmp/profile.plist /tmp/profile.mobileprovision
            echo "${env_key}=$NAME" >> "$GITHUB_ENV"
            echo "Installed profile '$NAME' ($UUID) → $env_key"
          }

          install_profile "$PROFILE_B64" APP_PROVISIONING_PROFILE_SPECIFIER
          if [ -n "${NSE_PROFILE_B64:-}" ]; then
            install_profile "$NSE_PROFILE_B64" NSE_PROVISIONING_PROFILE_SPECIFIER
          else
            echo '::warning::IOS_NSE_PROVISIONING_PROFILE_BASE64 unset — archive will fail once the Notification Service Extension is required.'
          fi
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/([0-9A-F]*)/(…)/'

      - name: Build signed archive
        timeout-minutes: 45
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.ver.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ steps.ver.outputs.build }}
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          # Manual signing passes NO -allowProvisioningUpdates and no API key:
          # that flag is what lets Xcode create a certificate, so withholding it
          # is the fix. Never pass PROVISIONING_PROFILE_SPECIFIER on the command
          # line: it applies to EVERY target and would force the NSE to the app's
          # profile. Each target expands its own user-defined variable instead.
          if [ "$SIGN_MODE" = manual ]; then
            xcodebuild -project clients/apple/Tether.xcodeproj \
              -scheme TetherIOS \
              -configuration Release -sdk iphoneos \
              -archivePath build/TetherIOS.xcarchive archive \
              -skipPackagePluginValidation \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              APP_PROVISIONING_PROFILE_SPECIFIER="$APP_PROVISIONING_PROFILE_SPECIFIER" \
              NSE_PROVISIONING_PROFILE_SPECIFIER="${NSE_PROVISIONING_PROFILE_SPECIFIER:-}" \
              MARKETING_VERSION="$MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
          else
            xcodebuild -project clients/apple/Tether.xcodeproj \
              -scheme TetherIOS \
              -configuration Release -sdk iphoneos \
              -archivePath build/TetherIOS.xcarchive archive \
              -skipPackagePluginValidation \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              MARKETING_VERSION="$MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
          fi

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
          BUNDLE_ID: com.samuelloranger.tether-mobile
          NSE_BUNDLE_ID: com.samuelloranger.tether-mobile.TetherNotificationService
        run: |
          set -euo pipefail
          # The export has to agree with how the archive was signed, or it
          # re-resolves the identity and can mint a certificate at THIS step.
          if [ "$SIGN_MODE" = manual ]; then
            NSE_PROFILE_ENTRY=""
            if [ -n "${NSE_PROVISIONING_PROFILE_SPECIFIER:-}" ]; then
              NSE_PROFILE_ENTRY="<key>$NSE_BUNDLE_ID</key><string>$NSE_PROVISIONING_PROFILE_SPECIFIER</string>"
            fi
            cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$APP_PROVISIONING_PROFILE_SPECIFIER</string>
              $NSE_PROFILE_ENTRY
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath build/TetherIOS.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist ExportOptions.plist
          else
            cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath build/TetherIOS.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist ExportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID"
          fi

      # if: always() — a failed archive still leaves the key on the runner.
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.mode == 'manual'
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain ~/Library/Keychains/tether-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true

      - name: Validate build
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find build/export -name '*.ipa' | head -1)"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # continue-on-error: `publish` gates on this job, and a rejected upload
      # (duplicate build number, Apple outage, review rule) must not strand the
      # release in draft. scope=testflight uploads on a manual run too.
      - name: Upload to TestFlight
        if: github.event_name == 'push' || inputs.scope == 'testflight'
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find build/export -name '*.ipa' | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload IPA workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tether-ios-${{ github.sha }}
          path: build/export/*.ipa

  # The gate: the ios build must succeed before the release leaves draft.
  # Publishing is also what makes the tag public; until then `releases/latest`
  # still points at the previous good release.
  publish:
    if: github.event_name == 'push'
    needs: [ios]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
