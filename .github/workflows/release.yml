name: Release builds

# Two lanes build the same apps: iOS and Mac (clients/apple, uploaded to TestFlight) and the
# desktop client for Windows and Linux (clients/desktop, through desktop-build.yml).
#
# Release lane: scripts/release.sh pushes the tag vX.Y.Z. The `draft` job opens a DRAFT
# release, iOS and Mac upload to TestFlight, the desktop installers attach to the draft, and
# only when the iOS and desktop builds succeed does `publish` take it out of draft. A failed
# build therefore never becomes the public `releases/latest`. The stable desktop update feeds
# move after that.
#
# Edge lane: every push to main that CI passes. iOS and Mac go to TestFlight as the next
# patch version (a build of X.Y.Z+1, so it always sits above the last release), and the
# desktop client goes to the edge update channel as X.Y.Z+1-main.N. No tag, no GitHub release.
# Only what changed since the last edge build of that platform is rebuilt; the hidden refs
# refs/edge/ios, refs/edge/mac and refs/edge/desktop record those commits.
#
# Manual runs are build-only: they upload workflow artifacts without touching a release.
#
# Why a tag push and not a `release` event: GitHub does not run workflows for
# draft releases, so CI cannot be triggered BY a draft; it has to CREATE the
# draft.
on:
  push:
    tags: ['v*.*.*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Artifacts to build without publishing
        type: choice
        options:
          - ios
          - testflight
          - mac
          - mac-testflight
          - desktop
        default: ios

permissions:
  contents: write

# Edge runs queue behind each other so each one diffs against the commits the previous one
# shipped; releases never wait on them.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'release-edge' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

# On a tag push github.ref_name IS vX.Y.Z; on the other events it is a branch.
env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # Decides the lane, the commit, the versions and which platforms build. The edge lane
  # starts only from a green CI run of a push to this repository's main, and skips the
  # release commit itself: its tag already builds everything.
  plan:
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        !startsWith(github.event.workflow_run.head_commit.message, 'release: v'))
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      desktop_version: ${{ steps.plan.outputs.desktop_version }}
      channel: ${{ steps.plan.outputs.channel }}
      ios: ${{ steps.plan.outputs.ios }}
      mac: ${{ steps.plan.outputs.mac }}
      desktop: ${{ steps.plan.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          REF="$(git rev-parse HEAD)"
          APP_VERSION="$(jq -r .version package.json)"
          CARGO_VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"$/\1/p' clients/desktop/Cargo.toml | head -1)"
          IOS=false MAC=false DESKTOP=false CHANNEL=stable
          case "$EVENT" in
            push)
              LANE=release
              VERSION="${TAG#v}"
              DESKTOP_VERSION="$VERSION"
              IOS=true MAC=true DESKTOP=true
              if [ "$APP_VERSION" != "$VERSION" ] || [ "$CARGO_VERSION" != "$VERSION" ]; then
                echo "::error::Tag $TAG but package.json is $APP_VERSION and clients/desktop/Cargo.toml is $CARGO_VERSION. scripts/release.sh bumps both."
                exit 1
              fi
              ;;
            workflow_run)
              LANE=edge CHANNEL=edge
              IFS=. read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              DESKTOP_VERSION="$VERSION-main.$RUN_NUMBER"
              git fetch --quiet origin '+refs/edge/*:refs/edge/*' || true
              # Builds a platform when anything it is made from changed since the commit its
              # last edge build shipped, or when there is no such commit to compare with. CI
              # runs can finish out of order, so a commit the mark already contains is stale:
              # building it would ship older code under a newer build number.
              changed() {
                local base files
                base="$(git rev-parse -q --verify "refs/edge/$1" || true)"
                if [ -z "$base" ]; then
                  echo "$1: no earlier edge build to compare with"
                  return 0
                fi
                if git merge-base --is-ancestor "$REF" "$base"; then
                  echo "$1: ${base:0:7} already shipped this commit or a later one"
                  return 1
                fi
                if ! git merge-base --is-ancestor "$base" "$REF"; then
                  echo "$1: ${base:0:7} is not in this history any more"
                  return 0
                fi
                # Listed first: grep -q would stop reading early, and under pipefail the
                # diff's SIGPIPE would read as "unchanged".
                files="$(git diff --name-only "$base" "$REF")"
                if grep -qE "$2" <<< "$files"; then
                  echo "$1: changed since ${base:0:7}"
                  return 0
                fi
                echo "$1: unchanged since ${base:0:7}"
                return 1
              }
              PIPELINE='^\.github/(workflows/(release|desktop-build)\.yml|scripts/)'
              APPLE_SOURCES="^(clients/apple/|package\.json$|scripts/build-ssh-xcframeworks\.sh$)|$PIPELINE"
              if changed ios "$APPLE_SOURCES"; then IOS=true; fi
              if changed mac "$APPLE_SOURCES"; then MAC=true; fi
              if changed desktop "^clients/desktop/|$PIPELINE"; then DESKTOP=true; fi
              ;;
            workflow_dispatch)
              LANE=manual
              VERSION="$APP_VERSION"
              DESKTOP_VERSION="$CARGO_VERSION"
              case "$SCOPE" in
                ios | testflight) IOS=true ;;
                mac | mac-testflight) MAC=true ;;
                desktop) DESKTOP=true ;;
              esac
              ;;
            *)
              echo "::error::Unexpected event $EVENT"
              exit 1
              ;;
          esac
          {
            echo "lane=$LANE"
            echo "ref=$REF"
            echo "version=$VERSION"
            echo "desktop_version=$DESKTOP_VERSION"
            echo "channel=$CHANNEL"
            echo "ios=$IOS"
            echo "mac=$MAC"
            echo "desktop=$DESKTOP"
          } | tee -a "$GITHUB_OUTPUT"

  # Opens the draft the builds upload into, and hands it its id. Runs on every lane (as a
  # no-op off the release lane) so `needs: draft` never resolves to "skipped". The text
  # given here goes above GitHub's generated notes.
  draft:
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.open.outputs.id }}
    steps:
      - name: Open draft release
        id: open
        if: needs.plan.outputs.lane == 'release'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run of a failed workflow reuses the existing draft
          # rather than erroring on a duplicate tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Reusing existing release $TAG"
          else
            cat > downloads.md <<NOTES
          ### Downloads

          - **iPhone, iPad and Mac:** through TestFlight.
          - **Windows:** install with \`Tether-$VERSION-x64-Setup.exe\` (per-user, no admin); the app then updates itself. \`Tether-$VERSION-x64-portable.zip\` runs without installing but does not update. Neither is code-signed yet, so SmartScreen may warn on first launch.
          - **Linux (x86_64):** download \`Tether-$VERSION-x86_64.AppImage\`, make it executable (\`chmod +x\`) and run it; the app then updates itself in place. It needs FUSE 2 (\`libfuse2\`) to run directly, a Secret Service keyring for saved passwords and key passphrases, and \`SSH_AUTH_SOCK\` for agent authentication.
          - \`SHA256SUMS.txt\` covers every file.
          NOTES
            gh release create "$TAG" --draft --verify-tag --title "Tether $VERSION" \
              --notes-file downloads.md --generate-notes
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  # iOS = the native Swift client in clients/apple. It uploads to App Store Connect
  # (6800525706, com.samuelloranger.tether-mobile), so build numbers must never repeat:
  # github.run_number is monotonic per workflow, shared by both lanes, and survives
  # re-runs. `plan` picks the marketing version.
  #
  # On a release `publish` needs this job, so the TestFlight upload is continue-on-error
  # there: a rejected or flaky Apple upload must never hold back the GitHub release. On the
  # edge lane the upload IS the point, so a failure fails the job and the next edge run
  # retries it.
  ios:
    needs: [plan, draft]
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # altool discovers the key by ID under ~/.appstoreconnect/private_keys;
      # xcodebuild wants an explicit path. Write it once, satisfy both.
      - name: Install App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

      # A persisted identity avoids minting a new distribution certificate every
      # run (Apple caps them per account). Import one certificate and one profile
      # from secrets, sign manually, create nothing. The automatic path stays as a
      # fallback so a release still cuts before the secrets are configured — but it
      # is the path that burns certificates, so the log says so loudly.
      #
      #   IOS_DIST_CERT_P12_BASE64   Apple Distribution cert + key, .p12, base64
      #   IOS_DIST_CERT_PASSWORD     the password used to export that .p12
      #   IOS_PROVISIONING_PROFILE_BASE64
      #                              App Store profile for
      #                              com.samuelloranger.tether-mobile, base64
      #   IOS_NSE_PROVISIONING_PROFILE_BASE64
      #                              App Store profile for the
      #                              TetherNotificationService extension, base64
      - name: Detect signing mode
        id: signing
        env:
          HAS_CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_CERT" = "true" ]; then
            echo 'mode=manual' >> "$GITHUB_OUTPUT"
            echo 'Signing manually with the stored identity — no certificate will be created.'
          else
            echo 'mode=automatic' >> "$GITHUB_OUTPUT"
            echo '::warning::No IOS_DIST_CERT_P12_BASE64 / IOS_PROVISIONING_PROFILE_BASE64 secret set.'
            echo '::warning::Falling back to automatic signing, which MINTS A NEW CERTIFICATE on every run and will hit Apple'"'"'s per-account cap.'
          fi

      - name: Install signing identity
        if: steps.signing.outputs.mode == 'manual'
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          NSE_PROFILE_B64: ${{ secrets.IOS_NSE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # A throwaway keychain, not the login one: it is deleted in a later
          # step, and nothing else on the runner should see this key.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN=~/Library/Keychains/tether-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_B64" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f /tmp/dist.p12
          # Without this, codesign prompts for keychain access and hangs the job.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Search list, not default-keychain: xcodebuild reads the search list,
          # and replacing the default breaks other tooling on the runner.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          install_profile() {
            local b64="$1"
            local env_key="$2"
            PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
            mkdir -p "$PROFILES"
            printf '%s' "$b64" | base64 --decode > /tmp/profile.mobileprovision
            security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
            UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)"
            NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)"
            cp /tmp/profile.mobileprovision "$PROFILES/$UUID.mobileprovision"
            rm -f /tmp/profile.plist /tmp/profile.mobileprovision
            echo "${env_key}=$NAME" >> "$GITHUB_ENV"
            echo "Installed profile '$NAME' ($UUID) → $env_key"
          }

          install_profile "$PROFILE_B64" APP_PROVISIONING_PROFILE_SPECIFIER
          if [ -n "${NSE_PROFILE_B64:-}" ]; then
            install_profile "$NSE_PROFILE_B64" NSE_PROVISIONING_PROFILE_SPECIFIER
          else
            echo '::warning::IOS_NSE_PROVISIONING_PROFILE_BASE64 unset — archive will fail once the Notification Service Extension is required.'
          fi
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/([0-9A-F]*)/(…)/'

      - name: Build signed archive
        timeout-minutes: 45
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ needs.plan.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          # Manual signing passes NO -allowProvisioningUpdates and no API key:
          # that flag is what lets Xcode create a certificate, so withholding it
          # is the fix. Never pass PROVISIONING_PROFILE_SPECIFIER on the command
          # line: it applies to EVERY target and would force the NSE to the app's
          # profile. Each target expands its own user-defined variable instead.
          if [ "$SIGN_MODE" = manual ]; then
            xcodebuild -project clients/apple/Tether.xcodeproj \
              -scheme TetherIOS \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath build/TetherIOS.xcarchive archive \
              -skipPackagePluginValidation \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              APP_PROVISIONING_PROFILE_SPECIFIER="$APP_PROVISIONING_PROFILE_SPECIFIER" \
              NSE_PROVISIONING_PROFILE_SPECIFIER="${NSE_PROVISIONING_PROFILE_SPECIFIER:-}" \
              MARKETING_VERSION="$MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
          else
            xcodebuild -project clients/apple/Tether.xcodeproj \
              -scheme TetherIOS \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath build/TetherIOS.xcarchive archive \
              -skipPackagePluginValidation \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              MARKETING_VERSION="$MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
          fi

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
          BUNDLE_ID: com.samuelloranger.tether-mobile
          NSE_BUNDLE_ID: com.samuelloranger.tether-mobile.TetherNotificationService
        run: |
          set -euo pipefail
          # The export has to agree with how the archive was signed, or it
          # re-resolves the identity and can mint a certificate at THIS step.
          if [ "$SIGN_MODE" = manual ]; then
            NSE_PROFILE_ENTRY=""
            if [ -n "${NSE_PROVISIONING_PROFILE_SPECIFIER:-}" ]; then
              NSE_PROFILE_ENTRY="<key>$NSE_BUNDLE_ID</key><string>$NSE_PROVISIONING_PROFILE_SPECIFIER</string>"
            fi
            cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$APP_PROVISIONING_PROFILE_SPECIFIER</string>
              $NSE_PROFILE_ENTRY
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath build/TetherIOS.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist ExportOptions.plist
          else
            cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath build/TetherIOS.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist ExportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID"
          fi

      # if: always() — a failed archive still leaves the key on the runner.
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.mode == 'manual'
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain ~/Library/Keychains/tether-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true

      - name: Validate build
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find build/export -name '*.ipa' | head -1)"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # continue-on-error on a release only: `publish` gates on this job, and a rejected
      # upload (duplicate build number, Apple outage, review rule) must not strand the
      # release in draft. scope=testflight uploads on a manual run too.
      - name: Upload to TestFlight
        if: needs.plan.outputs.lane != 'manual' || inputs.scope == 'testflight'
        continue-on-error: ${{ needs.plan.outputs.lane == 'release' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find build/export -name '*.ipa' | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload IPA workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tether-ios-${{ github.sha }}
          path: build/export/*.ipa

  # The same app as a Mac Catalyst build, uploaded to the same App Store Connect
  # record (macOS platform) with the same build number. Signed with the iOS job's
  # Apple Distribution identity; the Mac-only pieces are the Catalyst App Store
  # profiles and a Mac Installer Distribution certificate for the .pkg:
  #
  #   MAC_PROVISIONING_PROFILE_BASE64      Mac Catalyst App Store profile, app
  #   MAC_NSE_PROVISIONING_PROFILE_BASE64  Mac Catalyst App Store profile, NSE
  #   MAC_INSTALLER_CERT_P12_BASE64        3rd Party Mac Developer Installer, .p12
  #   MAC_INSTALLER_CERT_PASSWORD          its export password
  #
  # Without them the job says so and builds nothing, so a release still cuts.
  # `xcodebuild -exportArchive` is not used: for a Mac app it checks the installer
  # certificate against the app profile and fails. productbuild packages the
  # already signed .app instead.
  mac:
    needs: [plan, draft]
    if: needs.plan.outputs.mac == 'true'
    runs-on: macos-26
    # The Mac app rides along with the iOS build; a Mac failure never holds the
    # GitHub release in draft. `shipped` tells the edge marks whether TestFlight got it,
    # since this job reports success either way.
    continue-on-error: true
    outputs:
      shipped: ${{ steps.upload.outcome == 'success' }}
    steps:
      - name: Check signing secrets
        id: signing
        env:
          READY: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.MAC_PROVISIONING_PROFILE_BASE64 != '' && secrets.MAC_NSE_PROVISIONING_PROFILE_BASE64 != '' && secrets.MAC_INSTALLER_CERT_P12_BASE64 != '' }}
        run: |
          if [ "$READY" = "true" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Mac signing secrets are not set; skipping the Mac build.'
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.signing.outputs.ready == 'true'
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        if: steps.signing.outputs.ready == 'true'
        with:
          xcode-version: latest-stable

      - name: Install App Store Connect API key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

      - name: Install signing identities
        if: steps.signing.outputs.ready == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          INSTALLER_B64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
          NSE_PROFILE_B64: ${{ secrets.MAC_NSE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN=~/Library/Keychains/tether-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          import_p12() {
            printf '%s' "$1" | base64 --decode > /tmp/identity.p12
            security import /tmp/identity.p12 -k "$KEYCHAIN" -P "$2" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security -f pkcs12
            rm -f /tmp/identity.p12
          }
          import_p12 "$CERT_B64" "$CERT_PASSWORD"
          import_p12 "$INSTALLER_B64" "$INSTALLER_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # Xcode 16+ reads UserData; older tools read MobileDevice.
          install_profile() {
            printf '%s' "$1" | base64 --decode > /tmp/profile.provisionprofile
            security cms -D -i /tmp/profile.provisionprofile > /tmp/profile.plist
            UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)"
            NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)"
            for dir in ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
              mkdir -p "$dir"
              cp /tmp/profile.provisionprofile "$dir/$UUID.provisionprofile"
            done
            rm -f /tmp/profile.plist /tmp/profile.provisionprofile
            echo "$2=$NAME" >> "$GITHUB_ENV"
            echo "Installed profile '$NAME' ($UUID) → $2"
          }
          install_profile "$PROFILE_B64" APP_PROVISIONING_PROFILE_SPECIFIER
          install_profile "$NSE_PROFILE_B64" NSE_PROVISIONING_PROFILE_SPECIFIER

          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" | sed -n 's/.*"\(3rd Party Mac Developer Installer[^"]*\)".*/\1/p' | head -1)"
          [ -n "$INSTALLER_IDENTITY" ] || { echo "::error::No installer identity in the keychain"; exit 1; }
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          security find-identity -v "$KEYCHAIN" | sed 's/([0-9A-F]*)/(…)/'

      # A signed Release build, not an archive: archiving the Catalyst app with
      # Xcode 26 produces SwiftTerm's build-tool plugin executable twice under
      # UninstalledProducts/macosx and fails. The built .app is what productbuild needs.
      - name: Build signed app
        if: steps.signing.outputs.ready == 'true'
        timeout-minutes: 45
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ needs.plan.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          xcodebuild -project clients/apple/Tether.xcodeproj \
            -scheme TetherIOS \
            -configuration Release -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build/dd build \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            APP_PROVISIONING_PROFILE_SPECIFIER="$APP_PROVISIONING_PROFILE_SPECIFIER" \
            NSE_PROVISIONING_PROFILE_SPECIFIER="$NSE_PROVISIONING_PROFILE_SPECIFIER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"

      - name: Package installer
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          APP=build/dd/Build/Products/Release-maccatalyst/TetherIOS.app
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements - --xml "$APP" > build/entitlements.plist 2>/dev/null
          grep -q com.apple.security.app-sandbox build/entitlements.plist \
            || { echo "::error::The Mac app is not sandboxed"; exit 1; }
          mkdir -p build/export
          xcrun productbuild --sign "$INSTALLER_IDENTITY" --component "$APP" /Applications build/export/Tether.pkg

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.ready == 'true'
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain ~/Library/Keychains/tether-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.provisionprofile \
            ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.provisionprofile || true

      - name: Validate build
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --validate-app -f build/export/Tether.pkg -t macos \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # continue-on-error on a release for the same reason as the iOS upload.
      - name: Upload to TestFlight
        id: upload
        if: steps.signing.outputs.ready == 'true' && (needs.plan.outputs.lane != 'manual' || inputs.scope == 'mac-testflight')
        continue-on-error: ${{ needs.plan.outputs.lane == 'release' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f build/export/Tether.pkg -t macos \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload pkg workflow artifact (manual runs)
        if: steps.signing.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tether-mac-${{ github.sha }}
          path: build/export/Tether.pkg

  # Windows and Linux, on the stable channel for a release and the edge channel otherwise.
  desktop:
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      version: ${{ needs.plan.outputs.desktop_version }}
      channel: ${{ needs.plan.outputs.channel }}

  # The installers a person downloads, with one checksum file for all of them, written next
  # to them so the names carry no path.
  desktop-assets:
    needs: [plan, draft, desktop]
    if: needs.plan.outputs.lane == 'release'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.desktop_version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tether-windows-${{ needs.plan.outputs.desktop_version }}
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: tether-linux-${{ needs.plan.outputs.desktop_version }}
          path: dist/linux

      - name: Attach to the draft
        run: |
          set -euo pipefail
          mkdir assets
          cp "dist/windows/Tether-$VERSION-x64-portable.zip" "dist/windows/Tether-$VERSION-x64-Setup.exe" \
            "dist/linux/Tether-$VERSION-x86_64.AppImage" assets/
          (cd assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" assets/* --clobber

  # The gate: the iOS build and the desktop installers must both land before the release
  # leaves draft. It also waits for mac, which is continue-on-error, so the Mac upload lands
  # first. Publishing is also what makes the tag public; until then `releases/latest` still
  # points at the previous good release.
  publish:
    needs: [plan, ios, mac, desktop-assets]
    if: needs.plan.outputs.lane == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest

  # Installed apps poll FEED_URL (crates/tether-app/src/updates.rs), each OS its own rolling
  # feed release, each channel its own releases.<channel>.json in it. A release moves the
  # stable channel once it is published; an edge build moves the edge channel and replaces
  # the edge installer kept on the feed, which is how an app joins the edge channel.
  feeds:
    needs: [plan, desktop, publish]
    if: >-
      always() && needs.plan.result == 'success' && needs.desktop.result == 'success' &&
      (needs.plan.outputs.lane == 'edge' || (needs.plan.outputs.lane == 'release' && needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            feed: windows-feed
            artifact: tether-windows
            installer: x64-Setup.exe
          - os: linux
            feed: linux-feed
            artifact: tether-linux
            installer: x86_64.AppImage
    # One run at a time per feed, across both lanes and every tag.
    concurrency:
      group: ${{ matrix.feed }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.desktop_version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ needs.plan.outputs.desktop_version }}
          path: dist

      - name: Point the update feed at this version
        run: |
          set -euo pipefail
          INSTALLER=()
          if [ "$CHANNEL" = edge ]; then
            INSTALLER=("dist/Tether-$VERSION-${{ matrix.installer }}" "Tether-edge-${{ matrix.installer }}")
          fi
          .github/scripts/update-feed.sh "${{ matrix.feed }}" "${{ matrix.os }}" "$CHANNEL" "$VERSION" dist/velopack "${INSTALLER[@]}"

  # Records the commit each platform's edge build shipped, so the next edge run rebuilds a
  # platform only when something it is made from changed. A platform whose build failed
  # keeps its old mark, and the next run tries it again.
  mark-edge:
    needs: [plan, ios, mac, feeds]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.lane == 'edge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Move the marks
        env:
          REF: ${{ needs.plan.outputs.ref }}
          IOS: ${{ needs.ios.result == 'success' }}
          MAC: ${{ needs.mac.outputs.shipped == 'true' }}
          DESKTOP: ${{ needs.feeds.result == 'success' }}
        run: |
          set -euo pipefail
          # A mark only moves forward: plan skips stale commits, so REF descends from it.
          for platform in ios mac desktop; do
            shipped="${platform^^}"
            [ "${!shipped}" = true ] || continue
            git push --force origin "$REF:refs/edge/$platform"
            echo "$platform shipped ${REF:0:7}"
          done
