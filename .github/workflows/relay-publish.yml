name: Build and Push Relay Image

# The push relay is separate infrastructure from the Tether server: it is the
# only internet-facing piece, it holds the APNs key, and it must never ship
# inside the `tether` binary. So it gets its own image, its own registry entry,
# and its own deploy trigger — the release workflow does not touch it.
on:
  release:
    types: [published]
  # Lets the relay be rebuilt and redeployed without cutting a Tether release,
  # since its lifecycle is genuinely independent of the app's.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tether-relay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/relay
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger deployer
        env:
          DEPLOYER_URL: ${{ secrets.RELAY_DEPLOYER_WEBHOOK_URL }}
          DEPLOYER_SECRET: ${{ secrets.RELAY_DEPLOYER_WEBHOOK_SECRET }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [ -z "$DEPLOYER_URL" ]; then
            echo "No RELAY_DEPLOYER_WEBHOOK_URL configured — image is published, skipping deploy."
            exit 0
          fi
          # The deployer only checks the HMAC and the event type; the body shape
          # mirrors a GitHub `package` event so the same webhook rules apply.
          BODY=$(jq -nc \
            --arg tag "${TAG#v}" \
            '{action: "published", package: {name: "tether-relay", package_version: {container_metadata: {tag: {name: $tag}}}}}')
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$DEPLOYER_SECRET" -binary | xxd -p -c 256)
          curl -fsS -X POST "$DEPLOYER_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: package" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            --data "$BODY"
